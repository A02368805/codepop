<svg width="1200" height="1500" viewBox="0 0 1200 1500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mountain Dew soda drink">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="1500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2E5039"/>
      <stop offset="1" stop-color="#1A3124"/>
    </linearGradient>
    <radialGradient id="shine" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(360 280) rotate(53) scale(540 420)">
      <stop stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drink" x1="600" y1="420" x2="600" y2="1290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7D35A"/>
      <stop offset="1" stop-color="#D07A40"/>
    </linearGradient>
    <linearGradient id="cup" x1="600" y1="350" x2="600" y2="1300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.36"/>
    </linearGradient>
    <filter id="blur" x="0" y="0" width="1200" height="1500" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <circle cx="200" cy="220" r="180" fill="#AEEA7B" fill-opacity="0.35" filter="url(#blur)"/>
  <circle cx="980" cy="300" r="170" fill="#F9E58E" fill-opacity="0.28" filter="url(#blur)"/>
  <circle cx="980" cy="1260" r="210" fill="#FFFFFF" fill-opacity="0.14" filter="url(#blur)"/>
  <rect width="1200" height="1500" fill="url(#shine)"/>

  <g transform="translate(282 212)">
    <rect x="18" y="38" width="600" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.85"/>
    <rect x="0" y="86" width="636" height="1012" rx="120" fill="url(#cup)" stroke="#FFFFFF" stroke-opacity="0.58" stroke-width="4"/>
    <rect x="34" y="194" width="568" height="860" rx="98" fill="url(#drink)"/>
    <rect x="76" y="224" width="488" height="104" rx="52" fill="#FFF7D8" fill-opacity="0.72"/>

    <g fill="#FFFFFF" fill-opacity="0.35">
      <rect x="126" y="412" width="86" height="86" rx="16" transform="rotate(-9 126 412)"/>
      <rect x="420" y="516" width="92" height="92" rx="17" transform="rotate(12 420 516)"/>
      <rect x="214" y="612" width="84" height="84" rx="14" transform="rotate(7 214 612)"/>
      <rect x="358" y="766" width="96" height="96" rx="16" transform="rotate(-11 358 766)"/>
    </g>

    <path d="M82 954C136 922 196 898 264 884C326 872 380 874 436 890C488 904 552 936 562 986C572 1034 538 1094 468 1122C408 1144 340 1144 284 1136C202 1122 138 1090 102 1042C80 1014 66 976 82 954Z" fill="#FFFFFF" fill-opacity="0.18"/>
  </g>

  <rect x="410" y="1322" width="380" height="80" rx="40" fill="#FFFFFF" fill-opacity="0.22"/>
  <circle cx="1020" cy="160" r="24" fill="#FFFFFF" fill-opacity="0.55"/>
  <circle cx="186" cy="1248" r="16" fill="#FFFFFF" fill-opacity="0.46"/>
</svg>
