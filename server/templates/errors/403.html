{% extends "base/base.html" %}

{% block title %}Access Restricted | FloatStack{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <p class="eyebrow">403</p>
        <h1>{{ error_title }}</h1>
        <div class="cta-row">
            <a class="button button--primary" href="{{ return_home_url }}">Return home</a>
            {% if show_sign_in %}
                <a class="button button--ghost" href="{% url 'login' %}">Sign in</a>
            {% endif %}
        </div>
    </div>
</section>
{% endblock %}
