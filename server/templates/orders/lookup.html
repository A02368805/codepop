{% extends "base/base.html" %}

{% block title %}Guest Order Lookup | FloatStack{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <p class="eyebrow">Guest Order Lookup</p>
        <h1>Find your guest order</h1>
        <p class="lede-small">Enter the lookup code from your confirmation page to track pickup progress.</p>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <label>
                {{ form.lookup_code.label }}
                {{ form.lookup_code }}
                {{ form.lookup_code.errors }}
            </label>
            <button class="button button--primary" type="submit">Track order</button>
        </form>
    </div>
</section>
{% endblock %}
