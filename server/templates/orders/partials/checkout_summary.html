<p class="eyebrow">Pricing</p>
{% if pricing %}
    <dl class="summary-list">
        <div><dt>Items</dt><dd>{{ cart.items|length }}</dd></div>
        <div><dt>Subtotal</dt><dd>${{ pricing.subtotal_amount }}</dd></div>
        <div><dt>Tax</dt><dd>${{ pricing.tax_amount }}</dd></div>
        <div><dt>Total</dt><dd>${{ pricing.total_amount }}</dd></div>
    </dl>
    <p class="muted">Pricing is validated on the server again when the order is created.</p>
{% else %}
    <p>No pricing is available for this cart yet.</p>
{% endif %}
