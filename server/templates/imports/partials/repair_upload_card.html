<article
    class="imports-upload-card"
    id="imports-repair-upload"
    {% if hx_swap_oob %}hx-swap-oob="outerHTML"{% endif %}
>
    <h2 class="imports-upload-title">Maintenance status CSV</h2>
    <form
        method="post"
        enctype="multipart/form-data"
        class="form-grid imports-upload-form"
        hx-post="{% url 'imports:repair-status' %}"
        hx-target="#import-history"
        hx-swap="innerHTML"
        hx-indicator="#import-history-indicator"
    >
        {% csrf_token %}
        {{ repair_form.non_field_errors }}
        <label class="field">
            <span>{{ repair_form.file.label }}</span>
            {{ repair_form.file }}
            {{ repair_form.file.errors }}
        </label>
        <button class="button button--primary" type="submit">Import maintenance CSV</button>
    </form>
</article>
